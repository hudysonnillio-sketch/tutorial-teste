<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fluxograma inteligente — TNP</title><style>:root{font-family:Arial,sans-serif;color:#243043;background:#f5f7fa}main{max-width:760px;margin:35px auto;padding:25px;background:white;border-radius:16px;box-shadow:0 3px 20px #0001}h1{font-size:24px;color:#8c6200}.small{color:#657184;font-size:14px}.panel{padding:22px;border:1px solid #dce2e9;border-radius:12px;margin-top:22px}button{padding:12px 18px;border-radius:8px;border:1px solid #c9d1dc;background:#fff;cursor:pointer;margin:5px;font-size:15px}button.primary{background:#145c82;color:white;border-color:#145c82}button:hover{filter:brightness(.94)}.notice{background:#f2f6fa;padding:15px;border-left:4px solid #145c82;margin-top:15px;line-height:1.5}.warn{border-color:#b07800;background:#fff8e7}.stop{border-color:#b44b4b;background:#fff2f2}#trail{font-size:13px;color:#697586;margin-top:20px}a{color:#145c82}footer{margin-top:30px;color:#697586;font-size:12px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d1dc;border-radius:7px;margin:5px 0 14px}</style></head><body><main><h1>Trabalho Não Presencial — TNP</h1><p class="small">Fluxograma decisório interativo • Registro funcional no RH após publicação da Portaria</p><div id="panel" class="panel" aria-live="polite"></div><div id="trail"></div><button id="back">← Voltar</button><button id="restart">↻ Reiniciar</button><footer>Protótipo demonstrativo, sem coleta ou armazenamento de dados. Baseado no procedimento de RH fornecido. A autorização do TNP tramita fora desta rotina.</footer></main><script>const nodes={start:{title:'A Portaria de autorização do TNP já foi publicada?',detail:'O RH registra o regime somente depois da publicação da Portaria.',opts:[['Sim','dados'],['Não','aguardar']]},aguardar:{title:'Aguardar a publicação',detail:'Não realizar o lançamento no RH. O requerimento, a anuência da chefia, o Plano de Trabalho e a autorização seguem tramitação própria no SEI.',kind:'stop'},dados:{title:'A Portaria informa matrícula, modalidade e período de vigência?',detail:'Confira esses três dados antes de lançar o movimento.',opts:[['Sim, todos constam','modalidade'],['Não ou há divergência','pendencia']]},pendencia:{title:'Regularizar ou esclarecer os dados',detail:'Não efetuar lançamento com dados incompletos ou divergentes. Encaminhe a pendência à unidade competente.',kind:'warn'},modalidade:{title:'Qual modalidade consta da Portaria?',detail:'A modalidade deve reproduzir a autorização publicada.',opts:[['Remota','lancar'],['Híbrida','lancar']]},lancar:{title:'Efetuar lançamento no RH',detail:'Acesse Cadastros > Contagem de Tempo > Lança Movimentos. Informe a matrícula e preencha os campos conforme a Portaria. Na justificativa, informe o número do processo SEI e o número da Portaria.',opts:[['Lançamento realizado','validar'],['Encontrei divergência','pendencia']]},validar:{title:'O lançamento confere com a Portaria e foi salvo?',detail:'Confira matrícula, modalidade, vigência e justificativa. Verifique o registro funcional.',opts:[['Sim','fim'],['Não','corrigir']]},corrigir:{title:'Corrigir antes de concluir',detail:'Revise o movimento no RH e faça nova conferência antes de encerrar.',opts:[['Voltar à conferência','validar']]},fim:{title:'Registro concluído',detail:'O TNP foi registrado e conferido nos assentamentos funcionais. O fluxo de RH está concluído.',kind:'done'}};let history=['start'];const panel=document.getElementById('panel'),trail=document.getElementById('trail');function go(k){history.push(k);render()}function render(){let key=history.at(-1),n=nodes[key];panel.innerHTML='';const h=document.createElement('h2');h.textContent=n.title;panel.append(h);const p=document.createElement('p');p.textContent=n.detail;panel.append(p);if(n.kind){const box=document.createElement('div');box.className='notice '+(n.kind==='stop'?'stop':n.kind==='warn'?'warn':'');box.textContent=n.kind==='done'?'✓ Etapa finalizada':n.kind==='stop'?'⛔ Lançamento não autorizado nesta etapa':'⚠ Pendência a resolver';panel.append(box)}if(n.opts){const wrap=document.createElement('div');n.opts.forEach(([label,next],i)=>{const b=document.createElement('button');b.className=i===0?'primary':'';b.textContent=label;b.onclick=()=>go(next);wrap.append(b)});panel.append(wrap)}trail.textContent='Etapas percorridas: '+history.length;document.getElementById('back').disabled=history.length===1}document.getElementById('back').onclick=()=>{if(history.length>1){history.pop();render()}};document.getElementById('restart').onclick=()=>{history=['start'];render()};render();</script></body></html>
